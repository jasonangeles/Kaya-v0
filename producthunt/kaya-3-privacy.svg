<svg xmlns="http://www.w3.org/2000/svg" width="2540" height="1520" viewBox="0 0 1270 760">
  <defs><linearGradient id="botfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="80%" stop-color="#000" stop-opacity="1"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter></defs>
  <rect width="1270" height="760" fill="#000"/><ellipse cx="360" cy="330" rx="380" ry="320" fill="#10b981" opacity="0.13" filter="url(#blur)"/><text x="560" y="232" font-family="Outfit Medium" font-size="14" letter-spacing="2" fill="#34d399">PRIVACY-FIRST</text><text x="560" y="294" font-family="Outfit SemiBold" font-size="50" letter-spacing="-1.5" fill="#fff">The spreadsheet</text><text x="560" y="350" font-family="Outfit SemiBold" font-size="50" letter-spacing="-1.5" fill="#fff">that updates itself.</text><text x="560" y="404" font-family="Outfit Regular" font-size="19" fill="#a1a1aa">Manual by design. It never touches your bank —</text><text x="560" y="431" font-family="Outfit Regular" font-size="19" fill="#a1a1aa">your balances stay on your device and sync</text><text x="560" y="458" font-family="Outfit Regular" font-size="19" fill="#a1a1aa">privately to you. Nothing else.</text><circle cx="571" cy="507" r="11" fill="rgba(16,185,129,0.12)"/><path d="M566 507 l3.5 3.5 l6 -7" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="512" font-family="Outfit Medium" font-size="17" fill="#d4d4d8">No bank logins or scraping</text><circle cx="571" cy="553" r="11" fill="rgba(16,185,129,0.12)"/><path d="M566 553 l3.5 3.5 l6 -7" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="558" font-family="Outfit Medium" font-size="17" fill="#d4d4d8">On-device, privately synced</text><circle cx="571" cy="599" r="11" fill="rgba(16,185,129,0.12)"/><path d="M566 599 l3.5 3.5 l6 -7" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="604" font-family="Outfit Medium" font-size="17" fill="#d4d4d8">Export or wipe anytime</text><g transform="translate(92,181) rotate(-3 157 199)"><g><defs><linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3f3f46"/><stop offset="55%" stop-color="#18181b"/><stop offset="100%" stop-color="#000"/></linearGradient>
  <clipPath id="screenClip"><rect x="7" y="7" width="300" height="384" rx="40"/></clipPath></defs><rect x="0" y="0" width="314" height="398" rx="46" fill="url(#frame)"/><rect x="7" y="7" width="300" height="384" rx="40" fill="#000"/><g clip-path="url(#screenClip)"><g transform="translate(7,41)"><text x="16" y="32" font-family="Outfit SemiBold" font-size="15" fill="#fff">Allocation</text><rect x="16" y="48" width="268" height="168" rx="18" fill="#141414" stroke="rgba(255,255,255,0.06)"/><rect x="32" y="68" width="80.24" height="9" fill="#10b981"/><rect x="112.24" y="68" width="56.64" height="9" fill="#e4e4e7"/><rect x="168.88" y="68" width="49.56" height="9" fill="#F7931A"/><rect x="218.44" y="68" width="49.56" height="9" fill="#71717a"/><rect x="32" y="68" width="236" height="9" rx="4.5" fill="none"/><circle cx="36" cy="98" r="4" fill="#10b981"/><text x="48" y="102" font-family="Outfit Regular" font-size="12" fill="#fff">Philippine Banks</text><text x="268" y="102" text-anchor="end" font-family="Outfit Medium" font-size="12" fill="#fff">34%</text><circle cx="36" cy="128" r="4" fill="#e4e4e7"/><text x="48" y="132" font-family="Outfit Regular" font-size="12" fill="#fff">Equities</text><text x="268" y="132" text-anchor="end" font-family="Outfit Medium" font-size="12" fill="#fff">24%</text><circle cx="36" cy="158" r="4" fill="#F7931A"/><text x="48" y="162" font-family="Outfit Regular" font-size="12" fill="#fff">Crypto Assets</text><text x="268" y="162" text-anchor="end" font-family="Outfit Medium" font-size="12" fill="#fff">21%</text><circle cx="36" cy="188" r="4" fill="#71717a"/><text x="48" y="192" font-family="Outfit Regular" font-size="12" fill="#fff">Cash &amp; Wallets</text><text x="268" y="192" text-anchor="end" font-family="Outfit Medium" font-size="12" fill="#fff">21%</text></g><rect x="7" y="241" width="300" height="150" fill="url(#botfade)"/></g><rect x="111" y="19" width="92" height="24" rx="12" fill="#000" stroke="rgba(255,255,255,0.05)"/></g></g></svg>