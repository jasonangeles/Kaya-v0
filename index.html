<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Kaya - OFW Wealth Tracker. Privacy-first wealth tracking."
    />

    <!-- PWA / installable home-screen app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaya" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <title>Kaya Wealth</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#000000',
              surface: '#0e0e0e',
              primary: '#ffffff',
              secondary: '#10b981',
              accent: '#f43f5e',
              textMain: '#ffffff',
              textMuted: '#8e8e93',
              border: '#1f1f1f',
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #000000;
        background-image:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 45%);
        background-attachment: fixed;
        color: #ffffff;
        font-family: 'Outfit', sans-serif;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* SVG Noise Overlay */
      #noice {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        pointer-events: none;
        z-index: 0; /* Changed from -1 to 0 to sit on top of background color */
        opacity: 0.05;
      }

      #root {
        position: relative;
        z-index: 1; /* Content sits above the noise */
      }

      /* Unified Glass Panel Style */
      .glass-panel {
        background-color: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.06) !important;
        position: relative;
        z-index: 1;
      }

      /* Surface Noise for Widgets */
      .glass-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.03; 
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Very subtle breathing pulse for the insights dot */
      @keyframes subtlePulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Inline SVG Noise Background -->
    <svg id="noice">
        <filter id="noise-filter">
            <feTurbulence type="fractalNoise" baseFrequency="1.24" numOctaves="4" stitchTiles="stitch"></feTurbulence>
            <feColorMatrix type="saturate" values="0"></feColorMatrix>
            <feComponentTransfer>
                <feFuncR type="linear" slope="0.34"></feFuncR>
                <feFuncG type="linear" slope="0.34"></feFuncG>
                <feFuncB type="linear" slope="0.34"></feFuncB>
                <feFuncA type="linear" slope="0.6"></feFuncA>
            </feComponentTransfer>
            <feComponentTransfer>
                <feFuncR type="linear" slope="1.47" intercept="-0.23"/>
                <feFuncG type="linear" slope="1.47" intercept="-0.23"/>
                <feFuncB type="linear" slope="1.47" intercept="-0.23"/>
            </feComponentTransfer>
        </filter>
        <rect width="100%" height="100%" filter="url(#noise-filter)"></rect>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
